<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>車検 事前カルテ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2733;
    --ink-soft:#5a6673;
    --line:#e4e8ee;
    --bg:#eef1f5;
    --card:#ffffff;
    --amber:#ef8a17;
    --amber-soft:#fff3e2;
    --teal:#0e7c7b;
    --teal-soft:#e2f2f1;
    --shadow:0 6px 24px rgba(27,39,51,.08);
    --shadow-lg:0 12px 40px rgba(27,39,51,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.6;}
  body{padding:0 0 40px;}

  .wrap{max-width:440px;margin:0 auto;padding:0 16px;}

  /* ===== Customer form ===== */
  .hero{
    margin:18px 0 14px;padding:22px 20px;border-radius:20px;color:#fff;
    background:linear-gradient(135deg,#233242 0%,#1b2733 100%);
    box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;
    border:14px solid rgba(239,138,23,.18);border-radius:50%;
  }
  .hero .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--amber);font-weight:700;}
  .hero h1{font-size:23px;font-weight:900;margin:6px 0 8px;line-height:1.3;}
  .hero p{font-size:13.5px;color:#c3ceda;}

  .step{margin:22px 0 10px;display:flex;align-items:center;gap:10px;}
  .step .no{
    width:26px;height:26px;flex:none;border-radius:50%;background:var(--ink);color:#fff;
    display:grid;place-items:center;font-weight:900;font-size:13px;
  }
  .step h2{font-size:16px;font-weight:700;}
  .step .sub{font-size:12px;color:var(--ink-soft);font-weight:500;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink);}
  .field label .opt{font-weight:500;color:var(--ink-soft);font-size:11px;margin-left:4px;}
  .field input{
    width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;
    font-family:inherit;font-size:16px;background:var(--card);color:var(--ink);transition:.15s;
  }
  .field input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft);}
  .field input::placeholder{color:#aab4bf;}

  /* symptom tiles = ダッシュボード警告灯モチーフ */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{
    position:relative;border:1.5px solid var(--line);border-radius:16px;background:var(--card);
    padding:16px 12px 14px;text-align:center;cursor:pointer;transition:.15s;user-select:none;
  }
  .tile .ico{font-size:26px;line-height:1;filter:grayscale(1);opacity:.55;transition:.15s;}
  .tile .t{font-size:13px;font-weight:700;margin-top:8px;line-height:1.35;}
  .tile .lamp{
    position:absolute;top:10px;right:10px;width:14px;height:14px;border-radius:50%;
    border:2px solid var(--line);background:transparent;transition:.15s;
  }
  .tile.sel{border-color:var(--amber);background:var(--amber-soft);box-shadow:0 4px 14px rgba(239,138,23,.22);}
  .tile.sel .ico{filter:none;opacity:1;transform:scale(1.05);}
  .tile.sel .lamp{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 4px rgba(239,138,23,.2);}
  .tile.none-sel.sel{border-color:var(--teal);background:var(--teal-soft);box-shadow:none;}
  .tile.none-sel.sel .lamp{background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 4px rgba(14,124,123,.18);}

  .field textarea{
    width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;
    font-family:inherit;font-size:16px;background:var(--card);color:var(--ink);resize:vertical;min-height:84px;
  }
  .field textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft);}

  .submit{
    width:100%;margin-top:22px;border:0;border-radius:14px;padding:17px;
    background:var(--amber);color:#fff;font-family:inherit;font-weight:900;font-size:16px;cursor:pointer;
    box-shadow:0 8px 20px rgba(239,138,23,.35);transition:.15s;
  }
  .submit:active{transform:translateY(1px);}
  .submit:disabled{opacity:.6;cursor:default;box-shadow:none;}
  .note{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:12px;line-height:1.5;}

  /* thank you */
  .thanks{text-align:center;padding:60px 20px;}
  .thanks .check{
    width:74px;height:74px;margin:0 auto 20px;border-radius:50%;background:var(--teal);color:#fff;
    display:grid;place-items:center;font-size:38px;box-shadow:0 10px 26px rgba(14,124,123,.3);
  }
  .thanks h2{font-size:22px;font-weight:900;margin-bottom:10px;}
  .thanks p{font-size:14px;color:var(--ink-soft);}
  .thanks .again{margin-top:26px;background:none;border:1.5px solid var(--line);border-radius:12px;
    padding:12px 20px;font-family:inherit;font-weight:700;color:var(--ink-soft);cursor:pointer;font-size:13px;}

  .hidden{display:none;}
</style>
</head>
<body>

<div id="viewCust">
  <div class="wrap" id="formArea">
    <div class="hero">
      <div class="eyebrow" id="brandLine">車検 事前カルテ</div>
      <h1>お車のこと、<br>先に教えてください</h1>
      <p>1分で完了します。お待ちの間にどうぞ。担当がすぐ確認します。</p>
    </div>

    <div class="step"><div class="no">1</div><div><h2>お客さま情報</h2></div></div>
    <div class="field">
      <label>お名前 <span class="opt">呼び名でも・空欄でもOK</span></label>
      <input id="fName" type="text" placeholder="例）山口 太郎">
    </div>
    <div class="field">
      <label>車種 <span class="opt">分かる範囲で</span></label>
      <input id="fCar" type="text" placeholder="例）N-BOX / 分からなければ空欄でOK">
    </div>
    <div class="field">
      <label>ナンバー <span class="opt">下4桁だけでOK</span></label>
      <input id="fPlate" type="text" inputmode="numeric" placeholder="例）・・12">
    </div>

    <div class="step"><div class="no">2</div><div><h2>気になることは？</h2><div class="sub">当てはまるものをタップ（いくつでも）</div></div></div>
    <div class="tiles" id="tiles"></div>

    <div class="step"><div class="no">3</div><div><h2>その他ひとこと</h2><div class="sub">なくてもOK</div></div></div>
    <div class="field">
      <textarea id="fFree" placeholder="例）長距離に乗る予定がある／前回から3年乗っている など"></textarea>
    </div>

    <button class="submit" id="submitBtn" onclick="submitForm()">この内容で送る</button>
    <p class="note">送信いただいた内容は、車検のご提案にのみ使用します。<br>担当スタッフがすぐに確認いたします。</p>
  </div>

  <!-- お礼画面 -->
  <div class="wrap thanks hidden" id="thanksArea">
    <div class="check">✓</div>
    <h2>ありがとうございます！</h2>
    <p>担当がすぐに確認します。<br>このままお待ちください。</p>
    <button class="again" onclick="resetForm()">別のお車を入力する</button>
  </div>
</div>

<script>
/* サーバー(GAS)から受け取った工場ID・工場名 */
var SHOP = '<?= shop ?>';
var SHOP_NAME = '<?= shopName ?>';

/* 困りごとタイル：お客さんの言葉だけ。商材名・専門用語は一切出さない
   （商材への紐づけと提案は「フロント確認画面」にだけ表示する） */
const SYMPTOMS = [
  { id:"ac",    ico:"❄️", label:"エアコンが臭う・効きが弱い" },
  { id:"power", ico:"🚗", label:"加速がもたつく・パワー不足" },
  { id:"fuel",  ico:"⛽", label:"燃費が落ちた気がする" },
  { id:"heat",  ico:"🌡️", label:"水温・オーバーヒートが心配" },
  { id:"brake", ico:"🛑", label:"ブレーキの効き・キーキー音" },
  { id:"none",  ico:"👍", label:"特に気になることはない", none:true },
];

let selected = new Set();

if (SHOP_NAME) {
  document.getElementById('brandLine').textContent = SHOP_NAME + '｜車検 事前カルテ';
}

buildTiles();

function buildTiles(){
  const el = document.getElementById('tiles');
  el.innerHTML = '';
  SYMPTOMS.forEach(s=>{
    const d = document.createElement('div');
    d.className = 'tile' + (s.none?' none-sel':'');
    d.innerHTML = `<span class="lamp"></span><div class="ico">${s.ico}</div><div class="t">${s.label}</div>`;
    d.onclick = ()=>toggleTile(s.id, d);
    el.appendChild(d);
  });
}
function toggleTile(id, el){
  // 「特にない」を押したら他を全部解除。逆に他を押したら「特にない」を解除。
  if(id==='none'){
    selected.clear(); document.querySelectorAll('.tile').forEach(t=>t.classList.remove('sel'));
    selected.add('none'); el.classList.add('sel'); return;
  }
  if(selected.has('none')){ selected.delete('none'); document.querySelectorAll('.tile.none-sel').forEach(t=>t.classList.remove('sel')); }
  if(selected.has(id)){ selected.delete(id); el.classList.remove('sel'); }
  else { selected.add(id); el.classList.add('sel'); }
}

function submitForm(){
  const btn = document.getElementById('submitBtn');
  const data = {
    shop:     SHOP,
    name:     document.getElementById('fName').value.trim(),
    carModel: document.getElementById('fCar').value.trim(),
    plate:    document.getElementById('fPlate').value.trim(),
    freeText: document.getElementById('fFree').value.trim(),
    troubles: [...selected]
  };

  btn.disabled = true;
  btn.textContent = '送信中…';

  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.success){
        document.getElementById('formArea').classList.add('hidden');
        document.getElementById('thanksArea').classList.remove('hidden');
        window.scrollTo(0,0);
      }else{
        alert((res && res.message) ? res.message : '送信に失敗しました。もう一度お試しください。');
        btn.disabled = false; btn.textContent = 'この内容で送る';
      }
    })
    .withFailureHandler(function(){
      alert('通信エラーが発生しました。電波の良い場所で再度お試しください。');
      btn.disabled = false; btn.textContent = 'この内容で送る';
    })
    .saveKarte(data);
}

function resetForm(){
  document.getElementById('fName').value='';
  document.getElementById('fCar').value='';
  document.getElementById('fPlate').value='';
  document.getElementById('fFree').value='';
  selected.clear();
  document.querySelectorAll('.tile').forEach(t=>t.classList.remove('sel'));
  const btn = document.getElementById('submitBtn');
  btn.disabled = false; btn.textContent = 'この内容で送る';
  document.getElementById('thanksArea').classList.add('hidden');
  document.getElementById('formArea').classList.remove('hidden');
  window.scrollTo(0,0);
}
</script>
</body>
</html>
