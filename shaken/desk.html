<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車検カルテ｜フロント確認</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2733;
    --ink-soft:#5a6673;
    --line:#e4e8ee;
    --bg:#eef1f5;
    --card:#ffffff;
    --amber:#ef8a17;
    --amber-soft:#fff3e2;
    --teal:#0e7c7b;
    --teal-soft:#e2f2f1;
    --shadow:0 6px 24px rgba(27,39,51,.08);
    --shadow-lg:0 12px 40px rgba(27,39,51,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.6;}
  body{padding:0 0 40px;}

  .wrap{max-width:440px;margin:0 auto;padding:0 16px;}

  /* ===== Front desk ===== */
  .fd-head{margin:18px 0 6px;}
  .fd-head .eyebrow{font-size:12px;letter-spacing:.1em;color:var(--amber);font-weight:700;min-height:14px;}
  .fd-head h1{font-size:20px;font-weight:900;}
  .fd-head p{font-size:12.5px;color:var(--ink-soft);}
  .fd-count{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--ink);color:#fff;
    padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;
  }
  .fd-count b{color:var(--amber);}
  .fd-upd{margin-top:8px;font-size:11px;color:var(--ink-soft);}
  .fd-upd .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:5px;vertical-align:middle;animation:blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}

  .entry{
    background:var(--card);border-radius:18px;padding:18px;margin-top:14px;box-shadow:var(--shadow);
    border-left:5px solid var(--amber);
  }
  .entry.calm{border-left-color:var(--teal);}
  .entry .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .entry .who{font-size:17px;font-weight:900;}
  .entry .car{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .entry .time{font-size:11px;color:#9aa5b1;white-space:nowrap;}
  .entry .plate{
    display:inline-block;margin-top:8px;border:1.5px solid var(--ink);border-radius:6px;
    padding:2px 10px;font-weight:700;font-size:13px;letter-spacing:.02em;
  }

  .symp{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;}
  .symp span{background:var(--amber-soft);color:#a8560a;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;}
  .symp .free{background:#eef1f5;color:var(--ink-soft);}

  .reco{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .reco .rl{font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.08em;margin-bottom:8px;}
  .reco .item{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px;}
  .reco .item .tier{
    flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
    font-weight:900;font-size:12px;color:#fff;background:var(--amber);
  }
  .reco .item .tier.matsu{background:#b0322e;}
  .reco .item .prod{font-weight:700;}
  .reco .item .for{color:var(--ink-soft);font-size:11.5px;}
  .reco .push{
    margin-top:12px;background:var(--teal-soft);color:#0a5b5a;border-radius:10px;padding:10px 12px;
    font-size:12.5px;font-weight:700;line-height:1.5;
  }
  .entry.calm .reco .push{background:#eef1f5;color:var(--ink-soft);}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty .big{font-size:40px;margin-bottom:12px;opacity:.4;}
  .empty p{font-size:14px;}

  .notice{
    margin-top:18px;background:var(--amber-soft);border:1.5px solid #f4c78a;color:#8a4b06;
    border-radius:14px;padding:16px;font-size:13px;line-height:1.7;
  }
  .notice code{background:#fff;border:1px solid #f0d3a8;border-radius:5px;padding:1px 6px;font-size:12px;}

  .hidden{display:none;}
</style>
</head>
<body>

<div id="viewDesk">
  <div class="wrap">
    <div class="fd-head">
      <div class="eyebrow" id="shopEyebrow"></div>
      <h1>本日の事前カルテ</h1>
      <p>お客さまの入力がここに届きます。新しい順・自動更新。</p>
      <div class="fd-count">受付済み <b id="cnt">0</b> 件</div>
      <div class="fd-upd"><span class="dot"></span><span id="upd">読み込み中…</span></div>
    </div>
    <div id="entries"></div>
  </div>
</div>

<script>
var SHOP = '<?= shop ?>';
var SHOP_NAME = '<?= shopName ?>';

/* 困りごとID → お客さんの言葉 ＋ 裏で紐づく提案（松竹梅・提案理由）
   ※この対応表はフロント確認画面にだけ存在する。お客さま画面には一切出さない。
   ※BG546は「次回交換までLLC性能を維持」する製品。「交換が不要になる」ではない。 */
const SYMPTOMS = [
  { id:"ac",    ico:"❄️", label:"エアコンが臭う・効きが弱い",
    reco:[{tier:"竹",prod:"Dr.Clean（MB-CL1 内部洗浄）＋ プレミアムフィルター PC-518S",for:"臭い・カビ対策"}] },
  { id:"power", ico:"🚗", label:"加速がもたつく・パワー不足",
    reco:[{tier:"松",prod:"BG107 RF-7 オイル添加剤",for:"エンジン内部を洗浄しレスポンス改善"}] },
  { id:"fuel",  ico:"⛽", label:"燃費が落ちた気がする",
    reco:[{tier:"松",prod:"BG107 RF-7 オイル添加剤",for:"燃焼効率の回復"}] },
  { id:"heat",  ico:"🌡️", label:"水温・オーバーヒートが心配",
    reco:[{tier:"松",prod:"BG546（Super Cool）クーラント",for:"次回交換までLLC性能を維持"}] },
  { id:"brake", ico:"🛑", label:"ブレーキの効き・キーキー音",
    reco:[{tier:"竹",prod:"K4PAD プレミアムパッド K-796WK",for:"制動力とタッチの改善"}] },
  { id:"none",  ico:"👍", label:"特に気になることはない", none:true, reco:[] },
];
const BYID = {};
SYMPTOMS.forEach(s=>{ BYID[s.id] = s; });

if (SHOP_NAME) document.getElementById('shopEyebrow').textContent = SHOP_NAME;

/* ===== 描画 ===== */
function renderDesk(items){
  const box = document.getElementById('entries');

  // 工場未指定（?shop= がない）ときの案内
  if(!SHOP){
    document.getElementById('cnt').textContent = '0';
    box.innerHTML = `<div class="notice">
      工場が指定されていません。URLの末尾に <code>&shop=工場ID</code> を付けてアクセスしてください。<br>
      例）<code>…/exec?view=desk&shop=tanaka</code></div>`;
    return;
  }

  document.getElementById('cnt').textContent = items.length;

  if(items.length===0){
    box.innerHTML = `<div class="empty"><div class="big">🗂️</div><p>まだ受付はありません。<br>お客さまの入力を待っています。</p></div>`;
    return;
  }

  box.innerHTML = items.map(e=>{
    // 保存されている困りごとID → 症状オブジェクト
    const syms = (e.troubles||[]).map(id=>BYID[id]).filter(Boolean);
    const calm = syms.length===0 || (syms.length===1 && syms[0].id==='none');

    const symTags = calm
      ? `<span class="free">気になる点なし</span>`
      : syms.filter(s=>s.id!=='none').map(s=>`<span>${s.label}</span>`).join('');
    const freeTag = e.freeText ? `<span class="free">📝 ${escapeHtml(e.freeText)}</span>` : '';

    // 裏で紐づく提案
    const recos = [];
    syms.forEach(s=>(s.reco||[]).forEach(r=>recos.push(r)));
    const recoHtml = recos.length ? `
      <div class="reco">
        <div class="rl">おすすめ提案</div>
        ${recos.map(r=>`
          <div class="item">
            <span class="tier ${r.tier==='松'?'matsu':''}">${r.tier}</span>
            <span class="prod">${escapeHtml(r.prod)}</span>
          </div>
          <div class="item"><span class="tier" style="visibility:hidden">・</span><span class="for">→ ${escapeHtml(r.for)}</span></div>
        `).join('')}
        <div class="push">💡 まず「松」から見せて、響いた項目を「竹」に足しましょう。</div>
      </div>` :
      `<div class="reco"><div class="push">😊 気になる点なし。まずは標準の「竹」を丁寧にご案内。</div></div>`;

    const who = e.name ? escapeHtml(e.name) : 'お名前未記入';
    const car = e.carModel ? escapeHtml(e.carModel) : '車種未記入';

    return `
      <div class="entry ${calm?'calm':''}">
        <div class="top">
          <div>
            <div class="who">${who}</div>
            <div class="car">${car}</div>
          </div>
          <div class="time">${escapeHtml(e.time||'')}</div>
        </div>
        ${e.plate?`<div class="plate">${escapeHtml(e.plate)}</div>`:''}
        <div class="symp">${symTags}${freeTag}</div>
        ${recoHtml}
      </div>`;
  }).join('');
}

function stampUpdated(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  document.getElementById('upd').textContent =
    '自動更新中 ｜ 最終更新 ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

/* ===== データ取得（当日ぶんを新しい順で）===== */
function refresh(){
  if(!SHOP){ renderDesk([]); return; }
  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.shopName) document.getElementById('shopEyebrow').textContent = res.shopName;
      renderDesk((res && res.items) ? res.items : []);
      stampUpdated();
    })
    .withFailureHandler(function(){ /* 一時的な通信失敗は無視して次の更新を待つ */ })
    .getKarteList(SHOP);
}

/* ===== helpers ===== */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 初回＋20秒ごとに自動更新（「その場で見る」を実現）
refresh();
setInterval(refresh, 20000);
</script>
</body>
</html>
